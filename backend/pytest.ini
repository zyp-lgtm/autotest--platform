[pytest]
# pytest 配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 最小 Python 版本
minversion = 3.11

# 命令行选项
addopts =
    # 详细输出
    -v
    # 显示本地变量
    --showlocals
    # 显示测试持续时间
    --durations=10
    # 颜色输出
    --color=yes
    # 严格标记
    --strict-markers
    # 覆盖率配置
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    # async 支持
    -p no:warnings
    --asyncio-mode=auto

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试（运行时间 > 1s）
    network: 需要网络的测试
    auth: 需要认证的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
